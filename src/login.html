<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#193A37">
  <meta name="robots" content="noindex">
  <meta name="description" content="Acceso a tu cuenta de Koodaria.">
  <title>Iniciar sesión — Koodaria</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/styles.css">
  <link rel="stylesheet" href="/assets/login.css">
</head>
<body class="login-page">
<a class="skip-link" href="#acceso">Saltar al contenido</a>
<header class="login-header"><div class="shell header-inner"><a class="wordmark" href="/" aria-label="Koodaria, inicio">koodaria<span>.</span></a><a class="login-close" href="/" aria-label="Cerrar y volver al inicio">{{icon:x}}</a></div></header>
<main id="acceso" class="login-layout shell">
  <section class="login-card" aria-labelledby="login-title">
    <h1 id="login-title">Iniciar sesión</h1>
    <p class="login-availability">Accede a tu cuenta con tu contraseña y tu aplicación autenticadora.</p>
    <a class="button login-submit" href="https://login.koodaria.com/realms/koodaria/account/">Continuar {{icon:arrow-right}}</a>
    <a class="login-card-back" href="/">Volver a Koodaria</a>
  </section>
</main>
<footer class="login-footer shell"><small>© 2026 Koodaria</small><a href="/#contacto">Privacidad</a></footer>
</body>
</html>
